<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
        document.documentElement.className = localStorage.getItem('theme') === 'dark' ? 'dark-theme' : 'light-theme';
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurora</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/intro.css') }}"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dynamicStyles.css') }}">
  </head>
  <body>
    <!-- Aurora Logo -->
    <div class="logo-container">
      <img
        src="{{ url_for('static', filename='images/logo.png') }}"
        alt="Aurora Logo"
        class="logo"
      />
      <img
        src="{{ url_for('static', filename='images/logoframe.png') }}"
        alt="Aurora Logo Frame"
        class="logoframe"
      />
      <img
        src="{{ url_for('static', filename='images/border.png') }}"
        alt="Border"
        class="border"
      />

      <!-- Using anchor tag instead of JavaScript onclick -->
      <a href="{{ url_for('home') }}">
        <img
          src="{{ url_for('static', filename='images/enter.png') }}"
          alt="Enter"
          class="enter-button"
        />
      </a>

      <!-- Footer -->
      <footer class="footer">
        <p>Made with (ﾉ◕ヮ◕)ﾉ*:･ﾟ✧ | Group 5</p>
      </footer>
    </div>

    <!-- Rotating dot behind Logo -->
    <div class="rotating-dots"></div>

    <!-- Pretty stars <3 -->
    <div class="star-container"></div>

    <!-- JavaScript for sparkle animation -->
    <script>
      function createStars() {
        const container = document.querySelector(".star-container");
        if (!container) {
          console.error("Error: .star-container not found.");
          return; // Prevents script from running if the element doesn't exist
        }

        for (let i = 0; i < 80; i++) {
          // Adjust for more/less stars
          let star = document.createElement("div");
          star.classList.add("star");

          // Randomize size & blur
          if (Math.random() > 0.7) star.classList.add("large");
          if (Math.random() > 0.5) star.classList.add("blurry");

          // Random positions
          star.style.left = `${Math.random() * 100}vw`;
          star.style.top = `${Math.random() * 100}vh`;

          // Random twinkle duration
          star.style.animationDuration = `${Math.random() * 3 + 2}s`;

          container.appendChild(star);
        }
      }

      // Run the function when the page loads
      document.addEventListener("DOMContentLoaded", createStars);
    </script>
  </body>
</html>
