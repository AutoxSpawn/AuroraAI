<!DOCTYPE html>
<html lang="en" class="light-theme">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dropMenu.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themeColor.css') }}">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <title>Drop Down Menu</title>
</head>

<li class="nav-dropdown">
  <div class="drop-wrapper">
    <button onclick="dropDownFunction()" class="dropDownButton">
      <ion-icon name="settings-outline"></ion-icon>
    </button>
    <div id="settingMenu" class="menu">
      <div class="menu-header">
        <h2 class="menu-header-title">Theme</h2>
        <div class="theme-switcher">
          <input type="radio" name="themes" id="light-theme">
          <label for="light-theme">
            <span>
              <ion-icon name="sunny-outline"></ion-icon>
              Light
            </span>
          </label>
    
          <input type="radio" name="themes" id="dark-theme">
          <label for="dark-theme">
            <span>
              <ion-icon name="moon-outline"></ion-icon>
              Dark
            </span>
          </label>
          <span class="slider"></span>
        </div>
      </div>

      <div class="menu-divider"></div>
  
      <div class="menu-body">
        <a href="{{ url_for('setting') }}">Setting</a>
        <a href="{{ url_for('contact')}}">Contact</a>
      </div>
    </div>
  </div>
</li>
</html>
