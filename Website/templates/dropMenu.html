<head>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Marck+Script&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Pacifico&family=Playwrite+AU+NSW:wght@100..400&display=swap" rel="stylesheet">
</head>

<li class="nav-dropdown">
  <div class="drop-wrapper">
    <button class="dropDownButton">
      <ion-icon name="settings-outline"></ion-icon>
    </button>
    <div id="settingMenu" class="menu">
      <div class="menu-header">
        <h2 class="menu-header-title">Theme</h2>
        <div class="theme-switcher">
          <input type="radio" name="themes" id="light-theme">
          <label for="light-theme">
            <span>
              <ion-icon name="sunny-outline"></ion-icon>
              Light
            </span>
          </label>
    
          <input type="radio" name="themes" id="dark-theme">
          <label for="dark-theme">
            <span>
              <ion-icon name="moon-outline"></ion-icon>
              Dark
            </span>
          </label>
          <span class="slider"></span>
        </div>
      </div>

      <div class="menu-divider"></div>
  
      <div class="menu-body">
        <a href="{{ url_for('setting') }}">Setting</a>
        <a href="{{ url_for('contact') }}">Contact</a>
      </div>
    </div>
  </div>
</li>

<script>
  //Theme Switcher
  function themeSwitcher() {
      const savedLightTheme = localStorage.getItem("selectedLightTheme") || "sky-theme";
      const savedDarkTheme = localStorage.getItem("selectedDarkTheme") || "space-theme";
      
      // Set up radio buttons if they exist
      const lightThemeRadio = document.getElementById("light-theme");
      const darkThemeRadio = document.getElementById("dark-theme");
      
      if (lightThemeRadio && darkThemeRadio) {
          const currentTheme = localStorage.getItem("currentTheme") || savedLightTheme;
          
          if (currentTheme === "dark-theme") {
            darkThemeRadio.checked = true;
          } else {
            lightThemeRadio.checked = true
          };
          
          lightThemeRadio.addEventListener("change", () => {
            applyTheme(savedLightTheme)
          });

          darkThemeRadio.addEventListener("change", () => {
            applyTheme(savedDarkTheme);
          });
      }
  }

  function applyTheme(theme) {
    const html = document.documentElement;
    const currentClasses = Array.from(html.classList).filter(cls => 
      !cls.endsWith("-theme") && 
      !cls.startsWith("size-") && 
      !cls.startsWith("font-")
    );

    // Remove any existing *-theme class
    html.classList.remove(...Array.from(html.classList).filter(cls => cls.endsWith("-theme")));
    html.classList.add(theme, ...currentClasses);
    localStorage.setItem("currentTheme", theme);
  }

  // drop down menu show function
  document.addEventListener('DOMContentLoaded', function() {

    themeSwitcher();

    const dropDownButton = document.querySelector('.dropDownButton');
    const settingMenu = document.getElementById('settingMenu');
    
    if (dropDownButton && settingMenu) {
      dropDownButton.addEventListener('click', function(event) {
        event.stopPropagation();
        settingMenu.classList.toggle('show');
      });
      
      // Close dropdown when clicking outside
      document.addEventListener('click', function(event) {
        if (!event.target.closest('.drop-wrapper')) {
          settingMenu.classList.remove('show');
        }
      });
    }
  });
</script>
