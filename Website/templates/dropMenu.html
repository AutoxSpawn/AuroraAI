<li class="nav-dropdown">
  <div class="drop-wrapper">
    <button class="dropDownButton">
      <ion-icon name="settings-outline"></ion-icon>
    </button>
    <div id="settingMenu" class="menu">
      <div class="menu-header">
        <h2 class="menu-header-title">Theme</h2>
        <div class="theme-switcher">
          <input type="radio" name="themes" id="light-theme">
          <label for="light-theme">
            <span>
              <ion-icon name="sunny-outline"></ion-icon>
              Light
            </span>
          </label>
    
          <input type="radio" name="themes" id="dark-theme">
          <label for="dark-theme">
            <span>
              <ion-icon name="moon-outline"></ion-icon>
              Dark
            </span>
          </label>
          <span class="slider"></span>
        </div>

        <h2 class="menu-header-title" style="margin-top: 1.5em;">Overlay Effects</h2>
        <div class="overlay-effects">
          <label style="display: block; margin-bottom: 0.4em;">
            <input type="radio" name="overlayEffect" value="overlay-none" checked>
            None
          </label>
          <label style="display: block; margin-bottom: 0.4em;">
            <input type="radio" name="overlayEffect" value="overlay-aurora">
            Aurora
          </label>
          <label style="display: block;">
            <input type="radio" name="overlayEffect" value="overlay-eclipse">
            Eclipse
          </label>
        </div>
      </div>

      <div class="menu-divider"></div>
  
      <div class="menu-body">
        <a href="{{ url_for('setting') }}">Setting</a>
        <a href="{{ url_for('contact') }}">Contact</a>
      </div>
    </div>
  </div>
</li>

<script>
  //Theme Switcher
  function themeSwitcher() {
      // Set up radio buttons if they exist
      const lightThemeRadio = document.getElementById("light-theme");
      const darkThemeRadio = document.getElementById("dark-theme");
      
      if (lightThemeRadio && darkThemeRadio) {
        const isDarkMode = localStorage.getItem("isDarkMode") === 'true';
          
          if (isDarkMode) {
            darkThemeRadio.checked = true;
          } else {
            lightThemeRadio.checked = true;
          };
          
          lightThemeRadio.addEventListener("change", () => {
            localStorage.setItem("isDarkMode", "false");
            applyTheme();
          });

          darkThemeRadio.addEventListener("change", () => {
            localStorage.setItem("isDarkMode", "true");
            applyTheme();
          });
      }
  }

  function applyTheme() {
    const html = document.documentElement;
    const isDarkMode = localStorage.getItem("isDarkMode") === 'true';
    const theme = isDarkMode
      ? localStorage.getItem("selectedDarkTheme") || "space-theme"
      : localStorage.getItem("selectedLightTheme") || "sky-theme";
    const size = localStorage.getItem("selectedFontSize") || "size-medium";
    const font = localStorage.getItem("selectedFonrFamily") || "font-poppins";
    
    html.className = `${theme} ${size} ${font}`;
  }

    function applyOverlay(overlay) {
    const body = document.body;
    body.classList.remove("overlay-none", "overlay-aurora", "overlay-eclipse");
    body.classList.add(overlay);
    localStorage.setItem("overlayEffect", overlay);
  }

  function initializeOverlay() {
    const savedOverlay = localStorage.getItem("overlayEffect") || "overlay-none";
    applyOverlay(savedOverlay);

    const overlayRadios = document.querySelectorAll('input[name="overlayEffect"]');
    overlayRadios.forEach(radio => {
      radio.checked = (radio.value === savedOverlay);
      radio.addEventListener("change", () => applyOverlay(radio.value));
    });
  }

  // drop down menu show function
  document.addEventListener('DOMContentLoaded', function() {

    themeSwitcher();
    initializeOverlay();

    const dropDownButton = document.querySelector('.dropDownButton');
    const settingMenu = document.getElementById('settingMenu');
    
    if (dropDownButton && settingMenu) {
      dropDownButton.addEventListener('click', function(event) {
        event.stopPropagation();
        settingMenu.classList.toggle('show');
      });
      
      // Close dropdown when clicking outside
      document.addEventListener('click', function(event) {
        if (!event.target.closest('.drop-wrapper')) {
          settingMenu.classList.remove('show');
        }
      });
    }
  });
</script>
