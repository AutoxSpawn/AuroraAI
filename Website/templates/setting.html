<!DOCTYPE html>
<html lang="en" class="light-theme size-medium font-poppins">
<head>    
  <meta charset="UTF-8">
  <title>Settings</title>
  <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico')}}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dynamicStyles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dropMenu.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/setting.css')}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Koh+Santepheap:wght@100;300;400;700;900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Solway:wght@300;400;500;700;800&family=Zain:ital,wght@0,200;0,300;0,400;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Marck+Script&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Pacifico&family=Playwrite+AU+NSW:wght@100..400&display=swap" rel="stylesheet">

  <!-- Icons -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>

<body>
  <header>
    <div class="logo">Aurora AI</div>
    <nav>
      <ul>
        <li><a href="{{ url_for('home') }}">Home</a></li>
        <li><a href="{{ url_for('about') }}">About</a></li>
        {% include 'dropMenu.html' %}
      </ul>
    </nav>
  </header>

  <main>
    <form id="settingsForm">
      <h2>Customize Your AuroraAI</h2>

      <!-- Font Family -->
      <div class="fontButtonGp">
        <p class="group-title">Font Family</p>
        <button type="button" class="font-option poppins-font">Poppins</button>
        <button type="button" class="font-option serif-font">DM Serif Display</button>
        <button type="button" class="font-option montserrat-font">Montserrat Alternates</button>
        <button type="button" class="font-option playwrite-font">Playwrite Australia NSW</button>
        <button type="button" class="font-option marck-font">Marck Script</button>
        <button type="button" class="font-option pacifico-font">Pacifico</button>
      </div>

      <!-- Font Size -->
      <div class="fontSizeGp">
        <p class="group-title">Font Size</p>
        <button type="button" class="small-size">Small</button>
        <button type="button" class="medium-size">Medium</button>
        <button type="button" class="large-size">Large</button>
      </div>

      <!-- Light Mode Theme -->
      <div class="lightThemeGp">
        <p class="group-title">Light Theme</p>
        <button type="button" class="sky-theme">Sky</button>
        <button type="button" class="violet-theme">Violet</button>
        <button type="button" class="matcha-theme">Matcha</button>
        <button type="button" class="peach-theme">Peach</button>
        <button type="button" class="rose-theme">Rose</button>
      </div>

      <!-- Dark Mode Theme -->
      <div class="darkThemeGp">
        <p class="group-title">Dark Theme</p>
        <button type="button" class="space-theme">Space</button>
        <button type="button" class="sea-theme">Sea</button>
      </div>

      <!-- Save Button -->
      <button type="button" class="saveButton" onclick="saveSettings()">Save Settings</button>
    </form>
  </main>

  <footer>
    <p>2024-2025
            Group 5 | Drexel University</p>
  </footer>

 <script>
    function updateHtmlClass(theme, size, font) {
        const html = document.documentElement;
        html.className = `${theme} ${size} ${font}`;
    }

    document.addEventListener('DOMContentLoaded', function() {
        applyCurrentTheme();
        applySavedSettings();
        setupButtonGroups();
    });

    function applyCurrentTheme() {
        const html = document.documentElement;
        const isDarkMode = localStorage.getItem('isDarkMode') === 'true';
        const theme = isDarkMode 
            ? localStorage.getItem('selectedDarkTheme') || "space-theme"
            : localStorage.getItem('selectedLightTheme') || "sky-theme";
        const size = localStorage.getItem('selectedFontSize') || "size-medium";
        const font = localStorage.getItem('selectedFontClass') || "font-poppins";
        
        html.className = `${theme} ${size} ${font}`;
    }

    const settingsConfig = {
        fontFamily: {
            classes: {
                "Poppins": "font-poppins",
                "DM Serif Display": "font-serif",
                "Montserrat Alternates": "font-montserrat",
                "Playwrite Australia NSW": "font-playwrite",
                "Marck Script": "font-marck",
                "Pacifico": "font-pacifico"
            },
            selector: '.fontButtonGp button',
            storageKey: 'selectedFontClass'
        },
        fontSize: {
            classes: {
                "Small": "size-small",
                "Medium": "size-medium",
                "Large": "size-large"
            },
            selector: '.fontSizeGp button',
            storageKey: 'selectedFontSize'
        },
        lightTheme: {
            classes: {
                "Sky": "sky-theme",
                "Violet": "violet-theme",
                "Matcha": "matcha-theme",
                "Peach": "peach-theme",
                "Rose": "rose-theme"
            },
            selector: '.lightThemeGp button',
            storageKey: 'selectedLightTheme'
        },
        darkTheme: {
            classes: {
                "Space": "space-theme",
                "Sea": "sea-theme"
            },
            selector: '.darkThemeGp button',
            storageKey: 'selectedDarkTheme'
        },
    };

    function saveSettings() {
        Object.entries(settingsConfig).forEach(([key, config]) => {
            const selectedBtn = document.querySelector(`${config.selector}.selected`);
            if (!selectedBtn) return;

            // Get the text content from the button's innerHTML or data attribute
            const label = selectedBtn.textContent.trim() || 
                         selectedBtn.dataset.themeName || 
                         selectedBtn.classList.value.match(/(sky|violet|matcha|peach|rose|space|sea)-theme/)?.[0].replace('-theme', '');
            
            if (!label) return;

            const selectedClass = config.classes[label];
            if (!selectedClass) return;

            localStorage.setItem(config.storageKey, selectedClass);
        });

        const isDarkMode = localStorage.getItem('isDarkMode') === 'true';
        const themeToApply = isDarkMode 
            ? localStorage.getItem('selectedDarkTheme') || "space-theme"
            : localStorage.getItem('selectedLightTheme') || "sky-theme";
        
        updateHtmlClass(
            themeToApply,
            localStorage.getItem('selectedFontSize') || "size-medium",
            localStorage.getItem('selectedFontClass') || "font-poppins"
        );
        
        alert("Settings Saved!");
    }

    function applySavedSettings() {
        const isDarkMode = localStorage.getItem('isDarkMode') === 'true';
        const theme = isDarkMode 
            ? localStorage.getItem('selectedDarkTheme') || "space-theme"
            : localStorage.getItem('selectedLightTheme') || "sky-theme";
        const size = localStorage.getItem('selectedFontSize') || "size-medium";
        const font = localStorage.getItem('selectedFontClass') || "font-poppins";

        updateHtmlClass(theme, size, font);

        Object.values(settingsConfig).forEach(config => {
            const savedClass = localStorage.getItem(config.storageKey);
            if (!savedClass) return;

            const label = Object.keys(config.classes).find(
                key => config.classes[key] === savedClass
            );

            if (!label) return;

            const buttons = document.querySelectorAll(config.selector);
            buttons.forEach(btn => {
                btn.classList.remove('selected');
                const btnLabel = btn.textContent.trim() || 
                                btn.dataset.themeName || 
                                btn.classList.value.match(/(sky|violet|matcha|peach|rose|space|sea)-theme/)?.[0].replace('-theme', '');
                if (btnLabel && config.classes[btnLabel] === savedClass) {
                    btn.classList.add('selected');
                }
            });
        });
    }

    function setupButtonGroups() {
        Object.values(settingsConfig).forEach(config => {
            const buttons = document.querySelectorAll(config.selector);
            buttons.forEach(button => {
                button.addEventListener('click', function() {
                    buttons.forEach(btn => btn.classList.remove('selected'));
                    this.classList.add('selected');
                });
            });
        });
    }
</script>
</body>
</html>
